<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <title>Math Runner</title>

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <main id="game">
      <!-- HUD -->
      <header id="hud">
        <div id="hud-stats">
          <div class="hud-item">
            <span class="hud-label">Score</span>
            <span id="score">0</span>
          </div>

          <div class="hud-item" id="level-control">
            <span class="hud-label level-label">Level</span>

            <div class="level-picker">
              <button id="level-up" type="button" aria-label="Higher level">
                ▲
              </button>

              <span id="level-number">1</span>

              <button id="level-down" type="button" aria-label="Lower level">
                ▼
              </button>
            </div>
          </div>

          <div class="hud-item">
            <span class="hud-label">Lives</span>
            <span id="lives">3</span>
          </div>
        </div>

        <div id="game-controls">
          <button id="mute-button" type="button" aria-label="Mute sound">
            <svg
              id="sound-on-icon"
              class="sound-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>

            <svg
              id="sound-off-icon"
              class="sound-icon hidden"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <button id="stop-button" type="button" aria-label="Stop">
            <span class="stop-icon"></span>
          </button>

          <button id="pause-button" type="button" aria-label="Play">▶</button>
        </div>
      </header>

      <!-- Game road -->
      <section id="road">
        <!-- Math question -->
        <h1 id="question">...</h1>

        <!-- Dynamic gate rows -->
        <div id="gate-rows"></div>

        <!-- Lanes -->
        <div id="lanes">
          <div class="lane" data-lane="0"></div>
          <div class="lane" data-lane="1"></div>
          <div class="lane" data-lane="2"></div>
        </div>

        <!-- Player -->
        <div id="player" data-lane="1">
          <img
            src="./assets/images/player.png"
            alt="Player car"
            class="player-image"
          />
        </div>
      </section>

      <!-- Start screen -->
      <div id="start-overlay">
        <button id="start-play-button" type="button" aria-label="Start game">
          <span class="start-play-icon">Ready !</span>

          <div class="start-go-sequence">
            <span class="start-go start-go-large">go</span>
            <span class="start-go start-go-medium">go</span>
            <span class="start-go start-go-small">go</span>
          </div>
        </button>
      </div>

      <!-- Operation controls -->
      <aside id="operation-controls">
        <label class="operation-option">
          <input
            type="checkbox"
            class="operation-checkbox"
            value="addition"
            checked
          />
          <span>+</span>
        </label>

        <label class="operation-option">
          <input
            type="checkbox"
            class="operation-checkbox"
            value="subtraction"
          />
          <span>−</span>
        </label>

        <label class="operation-option">
          <input
            type="checkbox"
            class="operation-checkbox"
            value="multiplication"
          />
          <span>×</span>
        </label>

        <label class="operation-option">
          <input type="checkbox" class="operation-checkbox" value="division" />
          <span>÷</span>
        </label>

        <label class="operation-option all-option">
          <input type="checkbox" id="select-all-operations" />
          <span>All</span>
        </label>

<div class="answer-mode-options">
  <label class="operation-option answer-mode-option">
    <input
      type="radio"
      name="answer-mode"
      value="limit"
      checked
    />
    <span>Lim</span>
  </label>

  <label class="operation-option answer-mode-option">
    <input
      type="radio"
      name="answer-mode"
      value="easy"
    />
    <span>Ezy</span>
  </label>

  <label class="operation-option answer-mode-option">
    <input
      type="radio"
      name="answer-mode"
      value="pro"
    />
    <span>Pro</span>
  </label>
</div>
      </aside>

      <!-- Level-up screen -->
      <div id="level-up-overlay" class="hidden">
        <div id="level-up-text">LEVEL 2</div>
      </div>

      <!-- Game-over screen -->
      <section id="game-over" class="hidden">
        <div class="game-over-title-wrapper">
          <img
            src="./assets/images/game-over.png"
            alt="Game Over"
            id="game-over-image"
          />
        </div>

        <p>
          Level:
          <span id="final-level">0</span>
        </p>

        <button id="restart-button" type="button">Restart</button>
      </section>

      <!-- Pause screen -->
      <div id="pause-overlay" class="hidden">
        <div class="pause-content">
          <div class="pause-icon">Ⅱ</div>
          <div class="pause-title">PAUSED</div>
        </div>
      </div>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
